version: "3.8"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=hadoop-cluster
    env_file:
      - ./config/hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - bigdata_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./config/hadoop.env
    ports:
      - target: 9864
        published: 9864
        mode: host
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - bigdata_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker


  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    hostname: resourcemanager
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870
    env_file:
      - ./config/hadoop.env
    ports:
      - "8088:8088"
    networks:
      - bigdata_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9000 namenode:9870 resourcemanager:8088
    env_file:
      - ./config/hadoop.env
    networks:
      - bigdata_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    hostname: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    env_file:
      - ./config/hadoop.env
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./apps:/opt/spark-apps
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf
    networks:
      - bigdata_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
    env_file:
      - ./config/hadoop.env
    ports:
      - target: 8081
        published: 8081
        mode: host
    networks:
      - bigdata_network
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
  hue:
    image: gethue/hue:latest
    hostname: hue
    ports:
      - "8888:8888"
    volumes:
      - ./config/hue.ini:/usr/share/hue/desktop/conf/hue.ini
    networks:
      - bigdata_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  jupyter:
    image: jupyter-spark:3.1.1
    hostname: jupyter
    user: root
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_TOKEN=""
    command: >
      start-notebook.sh 
      --NotebookApp.token='' 
      --NotebookApp.password=''
    ports:
      - "8889:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - bigdata_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  airflow:
    image: airflow-spark:2.6.3   
    hostname: airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - JAVA_HOME=/usr/lib/jvm/java-1.8.0-amazon-corretto
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./apps:/opt/spark-apps
    ports:
      - "8082:8080"
    networks:
      - bigdata_network
    depends_on:
      - postgres
      - mongodb
    command: >
      bash -c "export PATH=\"/home/airflow/.local/bin:$$PATH\" && 
               airflow db upgrade && 
               airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true && 
               (airflow scheduler & airflow webserver)"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - bigdata_network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
  
networks:
  bigdata_network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1500"

volumes:
  namenode-data:
  datanode-data:
  # mongo-data:
  postgres-data: